    function initFilters() {
      const roles = [...new Set(DATA.entries.map(e => e.role))].sort();
      const sel = document.getElementById('roleFilter');
      roles.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });

      const chips = document.getElementById('teamChips');
      TEAM_KEYS.forEach(key => {
        const cfg = DATA.teams[key];
        const c = document.createElement('button');
        c.className = 'chip on';
        c.dataset.team = key;
        c.textContent = cfg.full;
        c.style.background = cfg.color;
        c.onclick = () => {
          if (activeTeams.has(key)) { activeTeams.delete(key); c.classList.remove('on'); c.style.background = ''; }
          else { activeTeams.add(key); c.classList.add('on'); c.style.background = cfg.color; }
          renderAll();
        };
        chips.appendChild(c);
      });

      document.getElementById('search').oninput = renderAll;
      document.getElementById('roleFilter').onchange = renderAll;

      document.querySelectorAll('.tab').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        };
      });
    }

    function renderStats() {
      const el = document.getElementById('stats');
      const active = DATA.entries.filter(e => Object.keys(e.weeks).length > 0);
      el.innerHTML = [
        ['Задач/ресурсов', active.length],
        ['Пересечений', DATA.conflicts.length],
        ['Недель', DATA.weeks.length],
        ['Команд', TEAM_KEYS.length],
      ].map(([l,v]) => `<div class="stat"><div class="val">${v}</div><div class="lbl">${l}</div></div>`).join('');
    }

    function filterEntries() {
      const q = document.getElementById('search').value.toLowerCase();
      const role = document.getElementById('roleFilter').value;
      return DATA.entries.filter(e => {
        if (!activeTeams.has(e.team)) return false;
        if (role && e.role !== role) return false;
        if (q && !(`${e.task} ${e.resource} ${e.ticket} ${e.role}`.toLowerCase().includes(q))) return false;
        return Object.keys(e.weeks).length > 0;
      });
    }

    function isConflictWeekRole(weekIso, role) {
      return DATA.conflicts.some(c => c.week === weekIso && c.role === role);
    }

    function teamBadge(team) {
      const cfg = DATA.teams[team];
      return `<span class="team-badge" style="background:${cfg.bg};color:${cfg.color}">${cfg.full}</span>`;
    }

    function renderGantt() {
      const entries = filterEntries();
      const thead = document.querySelector('#ganttTable thead');
      const tbody = document.querySelector('#ganttTable tbody');
      const weekHeaders = DATA.weeks.map(w => `<th>${w.label}</th>`).join('');
      thead.innerHTML = `<tr><th data-col="team">Команда</th><th data-col="task">Задача</th><th data-col="resource">Ресурс</th><th data-col="role">Роль</th><th data-col="ticket">Тикет</th>${weekHeaders}</tr>`;

      if (!entries.length) {
        tbody.innerHTML = `<tr><td colspan="${5 + DATA.weeks.length}" class="empty">Нет данных по фильтрам</td></tr>`;
        return;
      }

      tbody.innerHTML = entries.map(e => {
        const cfg = DATA.teams[e.team];
        const cells = DATA.weeks.map(w => {
          const val = e.weeks[w.iso];
          if (!val) return '<td class="week-cell"></td>';
          const cls = isConflictWeekRole(w.iso, e.role) ? 'week-cell filled conflict' : 'week-cell filled';
          const bg = isConflictWeekRole(w.iso, e.role) ? '' : `background:${cfg.color};color:#fff;`;
          return `<td class="${cls}" style="${bg}" title="${val}">${val.length > 6 ? val.slice(0,5)+'…' : val}</td>`;
        }).join('');
        return `<tr>
          <td>${teamBadge(e.team)}</td>
          <td>${esc(e.task)}</td>
          <td>${esc(e.resource)}</td>
          <td>${esc(e.role)}</td>
          <td>${esc(e.ticket)}</td>${cells}</tr>`;
      }).join('');

      bindSort('#ganttTable', entries, renderGantt);
    }

    function renderConflicts() {
      const q = document.getElementById('search').value.toLowerCase();
      const role = document.getElementById('roleFilter').value;
      let rows = DATA.conflicts.filter(c => {
        if (role && c.role !== role) return false;
        if (!c.teams.some(t => { const k = Object.entries(DATA.teams).find(([_,v]) => v.full === t)?.[0]; return k && activeTeams.has(k); })) return false;
        if (q && !(c.role + c.teams.join() + c.tasks.join()).toLowerCase().includes(q)) return false;
        return true;
      });

      const thead = document.querySelector('#conflictsTable thead');
      const tbody = document.querySelector('#conflictsTable tbody');
      thead.innerHTML = '<tr><th>Неделя</th><th>Роль</th><th>Команды</th><th>Задачи</th></tr>';

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">Нет пересечений по фильтрам</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(c => `<tr class="conflict-row">
        <td>${c.weekLabel}</td>
        <td><strong>${esc(c.role)}</strong></td>
        <td>${c.teams.map(t => `<span class="team-badge" style="background:#ffc7ce;color:#9c0006;margin:1px">${esc(t)}</span>`).join(' ')}</td>
        <td><div class="conflict-tasks">${c.tasks.slice(0,5).map(esc).join('<br>')}${c.tasks.length > 5 ? `<br>… +${c.tasks.length-5}` : ''}</div></td>
      </tr>`).join('');
    }

    function renderWeekly() {
      const thead = document.querySelector('#weeklyTable thead');
      const tbody = document.querySelector('#weeklyTable tbody');
      const teamHeaders = TEAM_KEYS.map(k => `<th>${DATA.teams[k].full}</th>`).join('');
      thead.innerHTML = `<tr><th>Неделя</th><th>Всего</th>${teamHeaders}<th>Команды</th><th>Конфликты</th></tr>`;

      tbody.innerHTML = DATA.weekly.map(w => {
        const hasConflict = w.conflicts.length > 0;
        const multiTeam = w.activeTeams.length >= 2;
        const cls = hasConflict ? 'conflict-row' : (multiTeam ? 'multi-row' : '');
        const conflicts = w.conflicts.map(c => `${c.role} (${c.teams.join('+')})`).join('; ');
        const teamCells = TEAM_KEYS.map(k => {
          const name = DATA.teams[k].full;
          return `<td>${w.counts[name] ?? w.counts[k] ?? 0}</td>`;
        }).join('');
        return `<tr class="${cls}">
          <td>${w.weekLabel}</td>
          <td><strong>${w.total}</strong></td>
          ${teamCells}
          <td>${w.activeTeams.join(', ')}</td>
          <td style="color:var(--danger)">${esc(conflicts)}</td>
        </tr>`;
      }).join('');
    }

    function renderAll() {
      renderGantt();
      renderConflicts();
      renderWeekly();
    }

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function bindSort(selector, data, rerender) {
      document.querySelectorAll(`${selector} th[data-col]`).forEach(th => {
        th.onclick = () => {
          const col = th.dataset.col;
          if (sortState.col === col) sortState.asc = !sortState.asc;
          else { sortState.col = col; sortState.asc = true; }
          data.sort((a, b) => {
            const av = (a[col] || a.team || '').toString();
            const bv = (b[col] || b.team || '').toString();
            return sortState.asc ? av.localeCompare(bv, 'ru') : bv.localeCompare(av, 'ru');
          });
          rerender();
        };
      });
    }

    loadData().catch(err => {
      document.querySelector('.container').innerHTML = `<div class="empty" style="padding:4rem">
        <h2>Не удалось загрузить data.json</h2>
        <p style="margin-top:1rem;color:var(--muted)">Запустите локальный сервер в папке interactive:<br><code>python3 -m http.server 8080</code></p>
        <p style="margin-top:.5rem;color:var(--muted)">${err.message}</p>
      </div>`;
    });
  </script>
</body>
</html>
